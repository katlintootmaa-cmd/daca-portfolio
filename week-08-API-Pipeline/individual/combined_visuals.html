<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 8 visuaalide koondleht</title>
  <style>
    body {
      margin: 0;
      background: #f4f6f9;
      color: #1f2937;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 28px 32px 12px;
      background: #ffffff;
      border-bottom: 1px solid #d9e2ec;
    }
    main {
      display: grid;
      gap: 18px;
      padding: 22px 32px 36px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 700;
    }
    p {
      margin: 0;
      color: #52606d;
    }
    .visual {
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 12px;
      overflow: hidden;
    }
    img {
      display: block;
      width: 100%;
      max-width: 1200px;
      height: auto;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }
    ul {
      margin: 0;
      padding-left: 20px;
    }
    li {
      margin: 6px 0;
    }
    a {
      color: #1d4ed8;
    }
    @media (max-width: 720px) {
      header,
      main {
        padding-left: 14px;
        padding-right: 14px;
      }
      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Week 8 visuaalide koondleht</h1>
    <p>Tiimitöö, individuaalne töö ja API pipeline ühel lehel. Loodud: 2026-06-03 13:20</p>
  </header>
  <main>
    <section class="visual">
      <img src="combined_visuals_screenshot.png" alt="Week 8 API pipeline visuaalide koondpilt">
    </section>
    <section class="visual">
      <h2>Failid</h2>
      <ul>
      <li><a href="combined_visuals_screenshot.png">PNG koondpilt</a></li>
      <li><a href="../team/output/kpis_latest.csv">KPI CSV</a></li>
      <li><a href="../team/output/weekly_aggregates_latest.csv">Nadalase tulu CSV</a></li>
      <li><a href="../team/output/rfm_segment_summary_latest.csv">RFM segmentide CSV</a></li>
      <li><a href="../team/output/rfm_segments_latest.csv">RFM kliendisegmentide CSV</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
